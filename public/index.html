<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nion Pay</title>
    <meta name="description" content="A voice agent that pays with PayPal inside limits you set." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b6e5b'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top">
      <h1>Nion Pay</h1>
      <span class="badge" id="mode-badge" hidden>Demo mode</span>
    </header>

    <p class="banner" id="demo-banner" hidden>
      Demo mode. PayPal is not connected yet, so no money moves.
    </p>

    <main class="layout">
      <section class="talk" aria-label="Conversation">
        <ol class="log" id="log" aria-live="polite"></ol>

        <div class="approval" id="approval" hidden role="alertdialog" aria-labelledby="approval-title">
          <p class="approval-title" id="approval-title">Waiting for your yes</p>
          <p class="approval-amount" id="approval-amount"></p>
          <ul class="approval-reasons" id="approval-reasons"></ul>
          <p class="approval-meta">
            <span id="approval-timer"></span>
            <span id="approval-voice-hint">You can also say yes or no.</span>
          </p>
          <div class="approval-actions">
            <button type="button" class="btn primary" id="approve">Confirm payment</button>
            <button type="button" class="btn" id="decline">Cancel</button>
          </div>
        </div>

        <div class="composer">
          <div class="voice" id="voice">
            <button type="button" class="orb" id="orb" data-state="idle" aria-pressed="false">
              <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true">
                <path
                  d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-5a3.5 3.5 0 0 0-7 0v5A3.5 3.5 0 0 0 12 15Zm6-3.5a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.92V19H9.5a1 1 0 1 0 0 2h5a1 1 0 1 0 0-2H13v-1.58A6 6 0 0 0 18 11.5Z"
                  fill="currentColor"
                />
              </svg>
              <span class="visually-hidden" id="orb-label">Start talking</span>
            </button>
            <p class="voice-status" id="voice-status">Tap to talk</p>
          </div>

          <form class="type" id="form" autocomplete="off">
            <label class="visually-hidden" for="text">Type a message</label>
            <input id="text" type="text" maxlength="500" placeholder="Or type here, e.g. Pay $12 to Sunrise Cafe" />
            <button type="submit" class="btn primary" id="send">Send</button>
          </form>

          <p class="hint" id="hint"></p>
          <label class="toggle">
            <input type="checkbox" id="speak-replies" checked />
            Speak replies
          </label>
        </div>
      </section>

      <aside class="wallet" aria-label="Wallet">
        <section class="card">
          <h2>Today</h2>
          <p class="big" id="spent">&nbsp;</p>
          <div class="meter" role="progressbar" aria-label="Spent today" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="meter">
            <span id="meter-fill"></span>
          </div>
          <p class="muted" id="remaining"></p>
        </section>

        <section class="card">
          <h2>Your limits</h2>
          <ul class="rules" id="rules"></ul>
        </section>

        <section class="card">
          <h2>Approved merchants</h2>
          <ul class="merchants" id="merchants"></ul>
        </section>

        <section class="card">
          <h2>Activity</h2>
          <ol class="activity" id="activity"></ol>
          <p class="muted" id="activity-empty">Nothing yet.</p>
        </section>
      </aside>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
